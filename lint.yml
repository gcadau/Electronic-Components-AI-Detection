# Minimal CI: syntax errors + undefined names only (ruff "critical" preset).
# Place at .github/workflows/lint.yml — on every branch you want checked.
# NOTE: enable this only AFTER fixing the TabError files and the F821 issues,
# otherwise the badge starts red.
name: lint

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check --select E9,F63,F7,F82 .
